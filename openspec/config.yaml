schema: spec-driven

context: |
  Язык: русский. Все артефакты (proposal, specs, design, tasks) пишутся на русском.
  Структурные заголовки OpenSpec и ключевые слова SHALL/MUST остаются на английском.

  ## Проект
  Внутренний сайт QA-команды для учёта тестовых смартфонов: за кем закреплён
  (owner) и у кого сейчас на руках (holder). История выдач, отчёты о состоянии,
  фото, просрочки, Excel-экспорт, уведомления. Полный справочник — PLAN.md,
  он не является источником требований после миграции в OpenSpec.

  ## Стек
  - backend: Python 3.12, FastAPI, SQLAlchemy 2.0, Alembic, Pydantic v2,
    SQLite (WAL), зависимости через uv.
  - frontend: Vite 8, React, TypeScript, Mantine, TanStack Query, React Router, npm.
  - auth: серверные сессии в БД + httpOnly cookie (не JWT).
  - деплой: локальный, FastAPI раздаёт frontend/dist и /media/*.

  ## Термины
  - admin / user — роль доступа (users.role).
  - owner — владелец устройства (devices.owner_id, NOT NULL, всегда один,
    сменяемый). Это не роль.
  - holder — у кого телефон физически сейчас. Определяется активной записью
    checkouts (returned_at IS NULL); если её нет — holder = owner.
  - Состояния «на складе» нет: у каждого телефона есть владелец.

  ## Инварианты
  1. У устройства ровно один owner, обязателен.
  2. Не более одной активной выдачи на устройство (partial unique index).
  3. Нельзя выдать устройство самому себе (holder != owner при создании выдачи).
  4. Передача владения текущему holder автозакрывает выдачу
     (closed_reason = ownership_transferred).
  5. Архивировать можно только без активной выдачи, иначе 409 ACTIVE_CHECKOUT.
     Правило действует и для admin.
  6. Просрочка = активная выдача AND holder != owner AND expected_return_at < today.
     Считается только на бэкенде одной функцией для списка, дашборда, фильтров и Excel.
  7. Физического удаления нет: устройства — архив, пользователи — деактивация.
  8. Деактивация пользователя отправляет все его устройства в архив; при активных
     выдачах или чужих телефонах на руках — 409. Восстановление такого устройства
     требует нового владельца.
  9. Каждая мутация пишет device_events в той же транзакции.
  10. Архивное устройство read-only до восстановления.
  11. Выдача запрещена для status=repair/lost и для архивных устройств.
  12. Последнего активного admin нельзя разжаловать или деактивировать.

  ## Конвенции
  - UI на русском, код и идентификаторы на английском.
  - Бизнес-логика только в backend/app/services/, роуты тонкие.
  - Схема БД меняется только через Alembic-миграцию.
  - Даты в API — ISO 8601, в UI — ДД.ММ.ГГГГ.
  - Ошибки API: JSON {code, message}, message на русском.
  - Каждый инвариант покрыт тестом в backend/tests/.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - Явно указывать, что не входит в изменение
    - Ссылаться на capability-спеки, которые затрагиваются
  tasks:
    - Задачи не крупнее одного шага, с проверяемым результатом
    - Тесты на инварианты — отдельными задачами

# Per-operation guidance (optional)
operations:
  apply:
    guidance:
      - Перед реализацией прочитать затронутые capability-спеки
      - Не менять инварианты без отдельного change
