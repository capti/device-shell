web:
  address: 127.0.0.1
  port: 8081

storage:
  type: sqlite
  path: data/gatus.db

endpoints:
  - name: backend-health
    group: qa-test-staff
    url: http://127.0.0.1:8000/health
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[BODY].database == ok"
